name: Planner owner link checks

on:
  pull_request:
    paths:
      - "docs/evenements.html"
      - "docs/evenements.js"
      - "docs/evenements.css"
      - "docs/planner-owner-link.mjs"
      - "tests/planner-owner-link.test.mjs"
      - ".github/workflows/planner-owner-link.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-link:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run owner-only link tests
        run: node --test tests/planner-owner-link.test.mjs
