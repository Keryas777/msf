name: Diagnose MSF asset list (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-msf-asset-list.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous asset-list candidates
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          candidates = [
              {},
              {"sver": "10.5.0"},
              {"sver": "10_5_0"},
              {"version": "10.5.0"},
          ]
          base = "https://msf-api.m3.scopelypv.com/rules/asset-lists"

          for params in candidates:
              url = base + (("?" + urllib.parse.urlencode(params)) if params else "")
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "LoSP-endpoint-diagnostic/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(2 * 1024 * 1024 + 1)
                      parsed = json.loads(body)
                      result = parsed.get("result") if isinstance(parsed, dict) else None
                      print(json.dumps({
                          "url": url,
                          "status": response.status,
                          "contentType": response.headers.get("Content-Type"),
                          "contentLengthHeader": response.headers.get("Content-Length"),
                          "bytes": len(body),
                          "finalUrl": response.geturl(),
                          "rootKeys": sorted(parsed) if isinstance(parsed, dict) else None,
                          "timestamp": parsed.get("ts") if isinstance(parsed, dict) else None,
                          "error": parsed.get("err") if isinstance(parsed, dict) else None,
                          "categoryCount": len(result) if isinstance(result, dict) else None,
                          "categories": sorted(result) if isinstance(result, dict) else None,
                          "resourceCount": sum(
                              len(value.get("list", []))
                              for value in result.values()
                              if isinstance(value, dict) and isinstance(value.get("list"), list)
                          ) if isinstance(result, dict) else None,
                      }, sort_keys=True))
              except urllib.error.HTTPError as error:
                  body = error.read(512)
                  print(json.dumps({
                      "url": url,
                      "status": error.code,
                      "contentType": error.headers.get("Content-Type"),
                      "bytes": len(body),
                      "preview": body.decode("utf-8", "replace")[:200],
                  }, sort_keys=True))
              except Exception as error:
                  print(json.dumps({
                      "url": url,
                      "errorType": type(error).__name__,
                      "message": str(error),
                  }, sort_keys=True))
          PY
