name: Investigate MSF Web Playable client (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/investigate-msf-client.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Extract IL2CPP metadata from public build 10.5.0
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/msf-client
          mkdir -p "$root/raw" "$root/unpacked" "$root/data-files" "$root/dump"
          base=https://webplayable.m3.scopelypv.com/10_5_0/1666317/Build

          curl --fail --location --silent --show-error "$base/b03aef900365212daf07c9180a2c210c.data.gz" -o "$root/raw/client.data.gz"
          curl --fail --location --silent --show-error "$base/1bea101c7dcb2643833fb012fe40bc1c.framework.js.gz" -o "$root/raw/client.framework.js.gz"
          curl --fail --location --silent --show-error "$base/0ff9aed6cda3f63a95295ed31db4348e.wasm.gz" -o "$root/raw/client.wasm.gz"

          for source in "$root"/raw/*; do
            name=$(basename "$source" .gz)
            gzip -dc "$source" > "$root/unpacked/$name"
          done

          python - <<'PY'
          from pathlib import Path
          import struct
          source = Path("/tmp/msf-client/unpacked/client.data")
          payload = source.read_bytes()
          signature = b"UnityWebData1.0\0"
          assert payload.startswith(signature)
          position = len(signature)
          header_length = struct.unpack_from("<I", payload, position)[0]
          position += 4
          output = Path("/tmp/msf-client/data-files")
          entries = []
          while position < header_length:
              offset, size, path_length = struct.unpack_from("<III", payload, position)
              position += 12
              path = payload[position:position + path_length].decode("utf-8")
              position += path_length
              target = output / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload[offset:offset + size])
              entries.append((path, size))
          print("UNITY_ENTRIES", entries)
          PY

          curl --fail --location --silent --show-error             https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip             -o "$root/Il2CppDumper.zip"
          unzip -q "$root/Il2CppDumper.zip" -d "$root/Il2CppDumper"
          export DOTNET_ROLL_FORWARD=Major
          dotnet "$root/Il2CppDumper/Il2CppDumper.dll"             "$root/unpacked/client.wasm"             "$root/data-files/Il2CppData/Metadata/global-metadata.dat"             "$root/dump" || test -f "$root/dump/dump.cs"

          echo "DUMP_FILES"
          find "$root/dump" -maxdepth 2 -type f -printf '%s %p\n' | sort -n

          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path("/tmp/msf-client/dump")
          dump = (root / "dump.cs").read_text(errors="replace")
          targets = [
              "RemoteAssetClient", "RemoteAssetClientEntryEnhanced",
              "IHaveRacAssetList", "GetAssetList", "LoginData_CombatData",
              "LoginData_Insanity", "LoginData_CombatCards",
          ]
          lines = dump.splitlines()
          for target in targets:
              hits = [i for i, line in enumerate(lines) if re.search(rf"\b(class|interface|struct)\s+{re.escape(target)}\b", line)]
              for i in hits:
                  start = max(0, i - 8)
                  depth = 0
                  end = min(len(lines), i + 220)
                  for j in range(i, min(len(lines), i + 500)):
                      depth += lines[j].count("{") - lines[j].count("}")
                      if j > i and depth <= 0 and "{" in "\n".join(lines[i:j+1]):
                          end = j + 1
                          break
                  print(f"TYPE_BLOCK {target} L{i+1}-{end}")
                  print("\n".join(lines[start:end]))

          literals_path = root / "stringliteral.json"
          literals = json.loads(literals_path.read_text())
          needles = [
              "/rules/asset-lists", "Parse /rules/asset-lists response",
              "ParseAssetLists", "ldata_assetlists", "account/ldata_assetlists",
              "stoken", "sToken", "sessionToken", "securityToken",
              "serverToken", "x-scopely-titan-auth", "sver", "|1",
          ]
          print("MATCHED_STRING_LITERALS")
          for item in literals:
              value = str(item.get("value", ""))
              if any(needle.lower() in value.lower() for needle in needles):
                  print(json.dumps(item, sort_keys=True))
          PY
