name: Temporary isolated turn meter rebuild

on:
  push:
    branches:
      - agent/codex-turn-meter-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-turn-meter-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply audited turn meter implementation
        run: |
          curl -fsSL https://raw.githubusercontent.com/Keryas777/msf/2d9dbd5820c19c2c22950be1fe146199d98f5b5a/.github/workflows/tmp-turn-meter-finalize.yml -o /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          lines = Path('/tmp/source.yml').read_text().splitlines()
          marker = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply turn meter implementation idempotently')
          start = next(i for i in range(marker, len(lines)) if "python - <<'PY'" in lines[i])
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start + 1:end])) + '\n'
          Path('/tmp/turn_meter_impl.py').write_text(code)
          PY
          python /tmp/turn_meter_impl.py

      - name: Generate full pipeline
        run: |
          python -m scripts.msf_capabilities_parser.cli
          python -m scripts.msf_capabilities_normalizer.cli
          python - <<'PY'
          import hashlib, re
          from pathlib import Path
          checksum = hashlib.sha256(Path('data/msf-capabilities/normalized/capabilities.json').read_bytes()).hexdigest()
          p = Path('scripts/msf_capabilities_indexer/audit.py')
          text = p.read_text()
          text, n = re.subn(r'SNAPSHOT_CAPABILITIES_CHECKSUM = \(\n    "[0-9a-f]{64}"\n\)', f'SNAPSHOT_CAPABILITIES_CHECKSUM = (\n    "{checksum}"\n)', text, count=1)
          if n != 1:
              raise SystemExit('capabilities snapshot update failed')
          p.write_text(text)
          print('capabilities checksum', checksum)
          PY
          python -m scripts.msf_capabilities_indexer.cli
          python -m scripts.msf_capabilities_web_publisher.cli
          python -m scripts.msf_capabilities_explorer_builder.cli

      - name: Validate pipeline and tests
        run: |
          python -m scripts.msf_capabilities_parser.cli --check
          python -m scripts.msf_capabilities_normalizer.cli --check
          python -m scripts.msf_capabilities_indexer.cli --check
          python -m scripts.msf_capabilities_web_publisher.cli --check
          python -m scripts.msf_capabilities_explorer_builder.cli --check
          python -m unittest tests.test_msf_turn_meter_normalization tests.test_msf_ability_energy_normalization tests.test_msf_capabilities_normalizer tests.test_msf_capabilities_indexer tests.test_msf_capabilities_web_publisher tests.test_msf_capabilities_explorer_builder
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'codex*.test.mjs' | sort)
          if [ ${#files[@]} -gt 0 ]; then node --test "${files[@]}"; fi

      - name: Validate exact coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          caps = json.loads(Path('data/msf-capabilities/normalized/capabilities.json').read_text())
          ops = [o for o in caps['operations'] if o.get('kind') == 'turn_meter_modify']
          mappings = [m for m in caps['actionMappings'] if m.get('sourceActionType') == 'turn_meter']
          assert len(ops) == 540
          assert len(mappings) == 540
          assert {m['status'] for m in mappings} == {'normalized'}
          assert caps['audit']['mappedActionCount'] == 8179
          assert caps['audit']['preservedUninterpretedActionCount'] == 4148
          print('turn_meter_modify=540; normalized=8179; preserved=4148')
          PY

      - name: Commit clean result
        run: |
          rm -f .github/workflows/tmp-turn-meter-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: normalize turn meter changes in Codex [skip ci]'
          git push origin HEAD:agent/codex-turn-meter-rebuild
