name: Temporary verify 24 Oct R2 trophies
on:
  push:
    branches:
      - fix/standings-r2-20261024
    paths:
      - .github/workflows/standings-r2-recovery-once.yml
      - scripts/pull-alliance-history-r2.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify R2 list with AWS CLI without exposing any objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LOSP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LOSP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.LOSP_R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.LOSP_R2_BUCKET }}
        shell: bash
        run: |
          if command -v aws >/dev/null; then
            if aws s3api list-objects-v2 --bucket "$BUCKET" --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com" --max-keys 1 >/dev/null 2>&1; then
              echo "AWS CLI R2 ListObjectsV2 succeeded."
            else
              echo "AWS CLI R2 ListObjectsV2 failed."
            fi
          else
            echo "AWS CLI not installed."
          fi
      - name: Validate real post-war R2 archive without publishing
        env:
          LOSP_R2_ACCOUNT_ID: ${{ secrets.LOSP_R2_ACCOUNT_ID }}
          LOSP_R2_ACCESS_KEY_ID: ${{ secrets.LOSP_R2_ACCESS_KEY_ID }}
          LOSP_R2_SECRET_ACCESS_KEY: ${{ secrets.LOSP_R2_SECRET_ACCESS_KEY }}
          LOSP_R2_BUCKET: ${{ secrets.LOSP_R2_BUCKET }}
          LOSP_R2_ALLIANCE_MAP_JSON: ${{ secrets.LOSP_R2_ALLIANCE_MAP_JSON }}
        run: node scripts/pull-alliance-history-r2.mjs --date=2026-10-24
