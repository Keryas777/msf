name: Temporary turn meter snapshot fix

on:
  push:
    branches:
      - agent/codex-turn-meter-normalization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-turn-meter-normalization
      - name: Refresh validated downstream snapshots
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              'tests/test_msf_capabilities_web_publisher.py': [
                  ('29bea140f70a1efb08371b973c42a2664818944fad511989b2b7ec4b0f4cf4b5',
                   'a4c8cf5843c5283fad57e8696bf9057f410786837434a69b7f396cc7cee3faf7'),
              ],
              'tests/test_msf_capabilities_explorer_builder.py': [
                  ('"assignedOperations": 8368,', '"assignedOperations": 8876,'),
              ],
          }
          for path, replacements in updates.items():
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing snapshot in {path}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_msf_capabilities_web_publisher.py tests/test_msf_capabilities_explorer_builder.py
          git commit -m "test: refresh turn meter downstream snapshots"
          git push origin HEAD:agent/codex-turn-meter-normalization
