name: Validate player progression once

on:
  push:
    branches:
      - agent/player-dd-saga-progress
    paths:
      - .github/workflows/validate-player-progression-once.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-dd-saga-progress
          fetch-depth: 0

      - name: Find Kestrel ID
        run: |
          node <<'NODE'
          const fs = require('fs');
          const chars = JSON.parse(fs.readFileSync('docs/data/msf-characters.json', 'utf8'));
          const rosters = JSON.parse(fs.readFileSync('docs/data/rosters.json', 'utf8'));
          const normalize = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
          for (const c of chars) {
            const hay = normalize([c.id, c.nameKey, c.nameFr, c.nameEn].filter(Boolean).join(' '));
            if (hay.includes('crecerelle') || hay.includes('kestrel')) console.log('CATALOG', JSON.stringify(c));
          }
          const keys = new Set();
          for (const roster of rosters) for (const key of Object.keys(roster?.chars || {})) keys.add(key);
          for (const key of [...keys].sort()) {
            const hay = normalize(key);
            if (hay.includes('crecerelle') || hay.includes('kestrel')) console.log('ROSTER', key);
          }
          NODE
