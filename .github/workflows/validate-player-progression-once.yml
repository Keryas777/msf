name: Validate player progression once

on:
  push:
    branches:
      - agent/player-dd-saga-progress
    paths:
      - .github/workflows/validate-player-progression-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-dd-saga-progress
          fetch-depth: 0

      - name: Diagnose character IDs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const chars = JSON.parse(fs.readFileSync('docs/data/msf-characters.json', 'utf8'));
          const rosters = JSON.parse(fs.readFileSync('docs/data/rosters.json', 'utf8'));
          const rosterKeys = new Set();
          for (const roster of rosters) for (const key of Object.keys(roster?.chars || {})) rosterKeys.add(key);

          const needles = ['kestrel', 'doom', 'xavier', 'professeur', 'professor'];
          for (const c of chars) {
            const hay = [c.id, c.nameKey, c.nameFr, c.nameEn].filter(Boolean).join(' ').toLowerCase();
            if (needles.some((needle) => hay.includes(needle))) {
              console.log('CATALOG', JSON.stringify({ id: c.id, nameKey: c.nameKey, nameFr: c.nameFr, nameEn: c.nameEn }));
            }
          }
          for (const key of [...rosterKeys].sort()) {
            const hay = key.toLowerCase();
            if (needles.some((needle) => hay.includes(needle))) console.log('ROSTER', key);
          }
          NODE
