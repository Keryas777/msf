<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08101d" />
  <title>Renseignements de guerre — LoSP</title>
  <style>html.authChecking body{opacity:0;pointer-events:none}</style>
  <script>document.documentElement.classList.add("authChecking");</script>
  <script src="./auth-guard.js?v=8"></script>
  <link rel="stylesheet" href="./style.css?v=ts" />
  <link rel="stylesheet" href="./renseignements-guerre.css?v=16-live-rooms" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body class="warIntelPage">
  <a class="intelSkip" href="#intelBoard">Aller à la carte</a>
  <main id="intelMain" class="intelShell">
    <header class="intelHeader">
      <div class="intelHeaderText">
        <h1>Renseignements de guerre</h1>
      </div>
      <span id="intelAllianceDisplay" class="intelAllianceRich" hidden></span>
    </header>

    <section class="intelWorkspace" aria-label="Renseignements sur l’alliance adverse">
      <p id="intelDemoStatus" class="intelDemoNotice" hidden>Données de test. Retire le paramètre <code>?demo=1</code> pour revenir aux données publiées.</p>
      <div class="intelControls">
        <label class="intelField">
          <span>Alliance adverse</span>
          <span class="intelSelectWrap"><select id="intelAlliance" class="intelSelect" aria-label="Alliance adverse"></select><span aria-hidden="true">⌄</span></span>
        </label>
        <label class="intelField">
          <span>Date du relevé</span>
          <span class="intelSelectWrap"><select id="intelObservation" class="intelSelect" aria-label="Date du relevé"></select><span aria-hidden="true">⌄</span></span>
        </label>
      </div>

      <section class="intelMapPanel" aria-label="Carte tactique">
        <div class="intelModeBar" role="group" aria-label="Mode tactique">
          <button type="button" class="intelMode is-active" data-mode="overview" aria-pressed="true"><span aria-hidden="true">⌗</span><span>Vue générale</span></button>
          <button type="button" class="intelMode" data-mode="emitted" aria-pressed="false"><span aria-hidden="true">◎</span><span>Bonus émis</span></button>
          <button type="button" class="intelMode" data-mode="received" aria-pressed="false"><span aria-hidden="true">◌</span><span>Bonus reçus</span></button>
        </div>

        <p id="intelEmpty" class="intelEmpty" hidden>Aucun relevé disponible</p>
        <p id="intelLoadError" class="intelLoadError" role="status" hidden></p>
        <div id="intelBoard" class="intelBoard" data-mode="overview" aria-label="Carte interactive de l’héliporteur">
          <svg id="intelConnections" class="intelConnections" aria-hidden="true"></svg>
        </div>
        <section id="intelDetail" class="intelDetail" aria-live="polite" aria-label="Informations de la salle sélectionnée"></section>
      </section>
    </section>
  </main>
  <script src="./renseignements-guerre.js?v=12-live-data" defer></script>
</body>
</html>
