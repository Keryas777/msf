<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0b0c0d" />
  <title>Historique des Guerres</title>

  <link rel="stylesheet" href="./style.css?v=7" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-512.PNG" />
  <meta name="apple-mobile-web-app-title" content="LoSP" />
</head>

<body class="page-war-history">
  <div class="app">

    <header class="header" aria-label="Historique des guerres">
      <a href="./home.html" class="backBtn" aria-label="Retour">⬅️</a>

      <div class="headerLeft">
        <h1 class="title">Historique des Guerres</h1>
        <p class="subtitle">
          Consulte les performances et résultats des guerres passées
        </p>
      </div>

      <a href="./home.html" class="homeBtn" aria-label="Accueil">🏠</a>
    </header>

    <section class="card">
      <div class="cardHeader">
        <h2 class="cardTitle">Sélection</h2>
      </div>

      <div class="warHistoryFilters">
        <div class="warHistoryField">
          <label class="label" for="allianceSelect">Alliance</label>
          <select id="allianceSelect" class="select"></select>
        </div>

        <div class="warHistoryField">
          <label class="label" for="yearSelect">Année</label>
          <select id="yearSelect" class="select"></select>
        </div>

        <div class="warHistoryField">
          <label class="label" for="monthSelect">Mois</label>
          <select id="monthSelect" class="select"></select>
        </div>

        <div class="warHistoryField">
          <label class="label" for="daySelect">Jour</label>
          <select id="daySelect" class="select"></select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="cardHeader">
        <h2 class="cardTitle">Tableau</h2>
      </div>

      <div id="warHistoryMeta" class="warHistoryMeta"></div>

      <div class="warHistoryTableWrap">
        <div class="warHistoryTable">
          <div class="warHistoryRow warHistoryHead">
            <div class="warHistoryCell col-rank is-sticky-1">#</div>

            <button class="warHistoryCell col-player is-sticky-2 warHistoryHeadBtn" data-sort="name" type="button">
              Joueur
            </button>

            <button class="warHistoryCell col-ap warHistoryHeadBtn" data-sort="attack_points" type="button">
              Pts
            </button>

            <button class="warHistoryCell col-attacks warHistoryHeadBtn" data-sort="attacks" type="button">
              Att
            </button>

            <button class="warHistoryCell col-damage warHistoryHeadBtn" data-sort="damage" type="button">
              Dégâts
            </button>

            <button class="warHistoryCell col-defensewins warHistoryHeadBtn" data-sort="defense_wins" type="button">
              V. Déf
            </button>

            <button class="warHistoryCell col-defensebonus warHistoryHeadBtn" data-sort="defense_bonus" type="button">
              B. Déf
            </button>
          </div>

          <div id="warHistoryRows"></div>
        </div>
      </div>
    </section>

  </div>

  <script src="./war-history.js?v=7"></script>

  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;

      let reloading = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
          if (reg && typeof reg.update === "function") reg.update();
        } catch (e) {
          console.error(e);
        }
      });
    })();
  </script>
</body>
</html>
