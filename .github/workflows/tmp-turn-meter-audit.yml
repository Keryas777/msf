name: Temporary turn meter audit

on:
  push:
    branches:
      - agent/codex-turn-meter-normalization

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build parsed mechanics
        run: python -m scripts.msf_capabilities_parser.cli
      - name: Audit turn_meter records
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          doc = json.loads(Path('data/msf-capabilities/parsed/mechanics.json').read_text())
          actions = [a for a in doc.get('actions', []) if str(a.get('rawType', '')).lower() == 'turn_meter']

          def shape(v):
              if v is None: return 'null'
              if isinstance(v, bool): return 'bool'
              if isinstance(v, (int, float)): return 'number'
              if isinstance(v, str): return 'string'
              if isinstance(v, list): return 'list'
              if isinstance(v, dict): return 'object'
              return type(v).__name__

          report = {
              'count': len(actions),
              'parameterKeys': Counter(),
              'parameterKeySets': Counter(),
              'targetKeys': Counter(),
              'targetRelations': Counter(),
              'targetTypes': Counter(),
              'conditionKinds': Counter(),
              'changePctShapes': Counter(),
              'changePctMaxValues': Counter(),
              'actionPctMaxValues': Counter(),
              'propertyHandlingUnrecognized': Counter(),
              'propertyHandlingRawOnly': Counter(),
              'examplesByParameterKeySet': {},
              'anomalies': [],
          }

          def max_level(v):
              if isinstance(v, list):
                  return v[-1] if v else None
              return v

          for a in actions:
              params = a.get('parameters') if isinstance(a.get('parameters'), dict) else {}
              keys = tuple(sorted(params))
              report['parameterKeys'].update(params.keys())
              report['parameterKeySets'][keys] += 1
              report['examplesByParameterKeySet'].setdefault('|'.join(keys), a)

              target = a.get('target')
              if isinstance(target, dict):
                  report['targetKeys'].update(target.keys())
                  if 'relation' in target: report['targetRelations'][str(target['relation'])] += 1
                  if 'type' in target: report['targetTypes'][str(target['type'])] += 1
              else:
                  report['targetRelations']['<implicit>'] += 1

              for c in a.get('conditions', []) if isinstance(a.get('conditions'), list) else []:
                  if isinstance(c, dict): report['conditionKinds'][str(c.get('kind'))] += 1

              cp = params.get('change_pct')
              report['changePctShapes'][shape(cp)] += 1
              report['changePctMaxValues'][repr(max_level(cp))] += 1
              ap = params.get('action_pct')
              if ap is not None: report['actionPctMaxValues'][repr(max_level(ap))] += 1

              handling = a.get('propertyHandling') if isinstance(a.get('propertyHandling'), dict) else {}
              for k in handling.get('unrecognized', []) or []: report['propertyHandlingUnrecognized'][str(k)] += 1
              for k in handling.get('rawOnly', []) or []: report['propertyHandlingRawOnly'][str(k)] += 1

              if 'change_pct' not in params or cp is None:
                  report['anomalies'].append({'reason': 'missing_change_pct', 'action': a})
              if isinstance(cp, list) and not cp:
                  report['anomalies'].append({'reason': 'empty_change_pct', 'action': a})

          def normalize(obj):
              if isinstance(obj, Counter):
                  items = sorted(obj.items(), key=lambda kv: (-kv[1], str(kv[0])))
                  return {('|'.join(k) if isinstance(k, tuple) else str(k)): v for k, v in items}
              if isinstance(obj, dict): return {str(k): normalize(v) for k, v in obj.items()}
              if isinstance(obj, list): return [normalize(v) for v in obj]
              return obj

          out = normalize(report)
          Path('turn-meter-audit.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({k:v for k,v in out.items() if k not in {'examplesByParameterKeySet','anomalies'}}, ensure_ascii=False, indent=2))
          print('ANOMALIES', len(out['anomalies']))
          print(json.dumps(out['anomalies'][:10], ensure_ascii=False, indent=2))
          print('KEYSET EXAMPLES')
          print(json.dumps(out['examplesByParameterKeySet'], ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turn-meter-audit
          path: turn-meter-audit.json
