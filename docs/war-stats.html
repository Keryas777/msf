<!-- /docs/war-stats.html -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#0b0c0d" />
    <title>Stats de guerre</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css?v=5" />
    <link rel="stylesheet" href="./classements.css?v=5" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-512.PNG" />
    <meta name="apple-mobile-web-app-title" content="LoSP" />
  </head>

  <body>
    <div class="app">
      <header class="header rankingsHeader" aria-label="Stats de guerre">
        <a href="./home.html" class="homeBtn" aria-label="Accueil">🏠</a>
        <a href="./home.html" class="backBtn" aria-label="Retour">⬅️</a>
      </header>

      <section class="rankingsGrid" aria-label="Stats de guerre">
        
        <!-- ✅ UNIQUE TUILE -->
        <a href="./war-history.html" class="rankingsTile rankingsTile--history">
          <img
            class="rankingsTileImg"
            src="./HistoriqueStatsGA.webp"
            alt="Historique Stats GA"
            loading="eager"
            decoding="async"
          />
          <span class="srOnly">Historique Stats GA</span>
        </a>

      </section>
    </div>

    <script>
      (function () {
        const tiles = document.querySelectorAll(".rankingsTile");
        tiles.forEach((t) => {
          const press = () => {
            t.classList.add("is-pressed");
            clearTimeout(t.__pressTimer);
            t.__pressTimer = setTimeout(() => t.classList.remove("is-pressed"), 220);
          };
          const release = () => t.classList.remove("is-pressed");

          t.addEventListener("pointerdown", press, { passive: true });
          t.addEventListener("pointerup", release, { passive: true });
          t.addEventListener("pointercancel", release, { passive: true });
          t.addEventListener("mouseleave", release, { passive: true });
        });
      })();
    </script>

    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;

        let reloading = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });

        window.addEventListener("load", async () => {
          try {
            const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
            if (reg && typeof reg.update === "function") reg.update();
          } catch (e) {
            console.error(e);
          }
        });
      })();
    </script>
  </body>
</html>
