name: Diagnose MSF asset list (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-msf-asset-list.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Web Playable request headers
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = "https://msf-api.m3.scopelypv.com/rules/asset-lists"
          candidates = [
              {},
              {"Origin": "https://webplayable.m3.scopelypv.com"},
              {
                  "Origin": "https://webplayable.m3.scopelypv.com",
                  "Referer": "https://webplayable.m3.scopelypv.com/",
              },
              {
                  "Origin": "https://marvelstrikeforce.com",
                  "Referer": "https://marvelstrikeforce.com/",
              },
          ]

          for extra_headers in candidates:
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "LoSP-endpoint-diagnostic/1.0",
                  **extra_headers,
              }
              request = urllib.request.Request(base, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
                  parsed = json.loads(raw)
                  result = parsed.get("result") if isinstance(parsed, dict) else None
                  safe_response_headers = {
                      key: value
                      for key, value in response.headers.items()
                      if key.lower() in {
                          "content-type", "content-length", "cache-control",
                          "access-control-allow-origin", "vary", "server", "via",
                      }
                  }
                  print(json.dumps({
                      "requestHeaders": extra_headers,
                      "status": response.status,
                      "responseHeaders": safe_response_headers,
                      "bytes": len(raw),
                      "rootKeys": sorted(parsed) if isinstance(parsed, dict) else None,
                      "error": parsed.get("err") if isinstance(parsed, dict) else None,
                      "categoryCount": len(result) if isinstance(result, dict) else None,
                  }, sort_keys=True))
          PY
