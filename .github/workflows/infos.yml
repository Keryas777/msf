name: Update infos.json

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docs/data/infos_zeus.json"
      - "docs/data/infos_athena.json"
      - "docs/data/infos_kronos.json"
      - "docs/data/infos_dionysos.json"
      - "docs/data/infos_poseidon.json"
      - "docs/data/infos_hades.json"
      - "docs/data/alliances.json"
      - "scripts/lib/alliances-node.mjs"
      - "scripts/merge-infos.mjs"
      - ".github/workflows/infos.yml"

permissions:
  contents: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge alliance info files into docs/data/infos.json
        env:
          DATA_DIR: docs/data
          OUT_FILE: docs/data/infos.json
          JOUEURS_OUT_FILE: docs/data/joueurs.json
        run: |
          node --version
          node scripts/merge-infos.mjs
          echo "----- git status after merge -----"
          git status --porcelain

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/infos.json docs/data/joueurs.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update infos and joueurs JSON"
          git push origin HEAD:main
