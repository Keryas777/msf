name: Temporary turn meter workflow idempotency fix

on:
  push:
    branches:
      - agent/codex-turn-meter-normalization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-turn-meter-normalization
      - name: Make replacement helper idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-turn-meter-audit.yml')
          text = p.read_text()
          old = """              if old not in text:\n                  raise SystemExit(f'needle missing in {path}: {old[:80]!r}')\n              p.write_text(text.replace(old, new, count))\n"""
          new = """              if old not in text:\n                  if new in text:\n                      return\n                  raise SystemExit(f'needle missing in {path}: {old[:80]!r}')\n              p.write_text(text.replace(old, new, count))\n"""
          if old not in text:
              raise SystemExit('replacement helper not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-turn-meter-audit.yml
          git commit -m "chore: make turn meter workflow idempotent"
          git push origin HEAD:agent/codex-turn-meter-normalization
