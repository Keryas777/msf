name: Temporary turn meter mechanic fix

on:
  push:
    branches:
      - agent/codex-turn-meter-normalization

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-turn-meter-normalization
      - name: Add generic turn meter mechanic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/msf_capabilities_explorer_builder/presentation.py')
          text = p.read_text()
          old = '''GENERIC_MECHANICS = {
    "action-ability-energy": {
'''
          new = '''GENERIC_MECHANICS = {
    "action-turn-meter": {
        "label": "Jauge de vitesse",
        "sourceName": "turn_meter",
        "aliases": ["turn meter", "jauge de vitesse", "barre de tour"],
        "description": "Modification structurée de la jauge de vitesse selon les paramètres de combat.",
    },
    "action-ability-energy": {
'''
          if old not in text:
              raise SystemExit('GENERIC_MECHANICS insertion point not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/msf_capabilities_explorer_builder/presentation.py
          git commit -m "chore: add turn meter generic mechanic"
          git push origin HEAD:agent/codex-turn-meter-normalization
