name: Snapshot roster history

on:
  schedule:
    - cron: "0 23 * * 0"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Optional Sunday checkpoint (YYYY-MM-DD). Empty means last completed Sunday at 23:00 Europe/Paris.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve checkpoint
        id: checkpoint
        env:
          REQUESTED_CHECKPOINT: ${{ github.event.inputs.checkpoint }}
        run: |
          if [ -n "$REQUESTED_CHECKPOINT" ]; then
            checkpoint="$REQUESTED_CHECKPOINT"
          else
            checkpoint="$(node --input-type=module -e 'import {lastCompletedWeeklyCheckpoint} from "./scripts/lib/roster-checkpoint-dates.mjs"; console.log(lastCompletedWeeklyCheckpoint())')"
          fi

          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
          echo "Roster checkpoint: $checkpoint (Sunday 23:00 Europe/Paris)"

      - name: Validate roster history and shared date resolution
        run: |
          node --check docs/evolution.js
          node --check docs/evolution-classement.js
          node --check docs/evolution-periods.js
          node --test tests/roster-history-abilities.test.mjs tests/roster-monthly-snapshot-smoke.test.mjs tests/roster-weekly-checkpoints.test.mjs

      - name: Build weekly roster snapshot
        env:
          DATA_DIR: docs/data
          ROSTER_HISTORY_TZ: Europe/Paris
        run: |
          node scripts/snapshot-rosters.mjs \
            --checkpoint="${{ steps.checkpoint.outputs.checkpoint }}" \
            --write

      - name: Build evolution summary
        env:
          DATA_DIR: docs/data
        run: |
          node scripts/build-roster-evolution-summaries.mjs \
            --checkpoint="${{ steps.checkpoint.outputs.checkpoint }}" \
            --write

      - name: Verify generated scope
        shell: bash
        run: |
          unexpected=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file="${line:3}"
            case "$file" in
              docs/data/roster-history/*) ;;
              *)
                echo "Unexpected change outside roster history: $line"
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain --untracked-files=all)

          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi

      - name: Commit and push weekly roster history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/roster-history

          if git diff --staged --quiet; then
            echo "No roster history changes to commit."
            exit 0
          fi

          checkpoint="${{ steps.checkpoint.outputs.checkpoint }}"
          git commit -m "Update roster history ${checkpoint}"
          git push origin HEAD:main
