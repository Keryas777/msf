name: Apply Groq rate-limit fix

on:
  push:
    branches:
      - fix/groq-rate-limit-delays
    paths:
      - tmp/groq-rate-limit.patch
      - .github/workflows/tmp-apply-groq-rate-limit.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/groq-rate-limit-delays
          fetch-depth: 0

      - name: Apply targeted patch
        run: git apply --check tmp/groq-rate-limit.patch && git apply tmp/groq-rate-limit.patch

      - name: Validate JavaScript syntax
        run: |
          node --check docs/war-admin.js
          node --check workers/msf-war-ocr/worker.js

      - name: Run directly relevant tests
        run: node --test tests/war-admin-analysis.test.mjs

      - name: Verify targeted behavior
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const admin = await readFile('docs/war-admin.js', 'utf8');
          const worker = await readFile('workers/msf-war-ocr/worker.js', 'utf8');
          assert.ok(admin.includes('const ANALYSIS_QUEUE_DELAY_MS = 30000;'));
          assert.ok(admin.includes('data?.code === "GROQ_RATE_LIMIT"'));
          assert.ok(admin.includes('Math.ceil(retryAfterSeconds * 1000) + GEMINI_RETRY_MARGIN_MS'));
          assert.ok(admin.includes('const delay = ANALYSIS_QUEUE_DELAY_MS;'));
          assert.ok(worker.includes('code: "GROQ_RATE_LIMIT"'));
          assert.ok(worker.includes('model: model'));
          assert.ok(worker.includes('groqResponse.headers.get("retry-after")'));
          NODE
          git diff --check

      - name: Commit the fix and remove temporary files
        run: |
          rm -f tmp/groq-rate-limit.patch .github/workflows/tmp-apply-groq-rate-limit.yml
          rmdir tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(war): respect Groq rate limits between analyses"
          git push origin HEAD:fix/groq-rate-limit-delays
