<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07101f">
  <title>Synchronisation LoSP</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#050914;
      color:#eef4ff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main{
      width:min(100%,520px);
      padding:24px;
      border:1px solid #344a78;
      border-radius:20px;
      background:#0b1428;
      box-shadow:0 20px 60px #0008;
    }
    h1{margin:0 0 12px;font-size:1.5rem}
    p{margin:0;color:#b9c6e0;line-height:1.5}
    .status{margin-top:14px;color:#d7e0f2}
    .retry{
      display:block;
      width:100%;
      margin-top:18px;
      padding:14px 16px;
      border-radius:14px;
      text-align:center;
      text-decoration:none;
      font-weight:850;
      color:#fff;
      background:#2f7df6;
    }
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>Synchronisation LoSP</h1>
    <p>War Counter Vision vérifie ici uniquement la session locale utilisée pour les écritures administrateur.</p>
    <p id="authStatus" class="status">Vérification de la session…</p>
    <a id="retryLogin" class="retry" href="#" hidden>Se reconnecter avec Discord</a>
  </main>

  <script type="module">
    import {
      LOSP_AUTH_WORKER,
      clearLocalSession,
      readLocalSession,
      sanitizeWarCounterReturn,
      validateBearerToken
    } from "./war-counter-write-auth.js?v=2";

    const params = new URLSearchParams(window.location.search);
    const returnPage = sanitizeWarCounterReturn(params.get("return"));
    const attempted = params.get("attempt") === "1";
    const status = document.querySelector("#authStatus");
    const retry = document.querySelector("#retryLogin");

    function buildLoginUrl() {
      const next = `war-counter-auth.html?return=${encodeURIComponent(returnPage)}&attempt=1`;
      return `${LOSP_AUTH_WORKER}/login?next=${encodeURIComponent(next)}`;
    }

    const result = await validateBearerToken(readLocalSession());

    if (result.ok) {
      window.location.replace(`./${returnPage}`);
    } else {
      clearLocalSession();
      const loginUrl = buildLoginUrl();

      if (!attempted) {
        status.textContent = "Session d’écriture à resynchroniser. Redirection vers Discord…";
        window.location.replace(loginUrl);
      } else {
        status.textContent = "La session locale n’a pas pu être resynchronisée. Tu peux relancer la connexion Discord sans toucher au reste de l’application.";
        retry.href = loginUrl;
        retry.hidden = false;
      }
    }
  </script>
</body>
</html>
