name: Temporary Codex ability energy normalization

on:
  push:
    branches:
      - agent/codex-ability-energy-normalization

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/codex-ability-energy-normalization
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate capabilities pipeline
        run: |
          python -m scripts.msf_capabilities_parser.cli
          python -m scripts.msf_capabilities_parser.cli --check
          python -m scripts.msf_capabilities_normalizer.cli
          python -m scripts.msf_capabilities_normalizer.cli --check
          python -m scripts.msf_capabilities_indexer.cli
          python -m scripts.msf_capabilities_indexer.cli --check
          python -m scripts.msf_capabilities_web_publisher.cli
          python -m scripts.msf_capabilities_web_publisher.cli --check

      - name: Regenerate Codex Explorer
        run: |
          python -m scripts.msf_capabilities_explorer_builder.cli
          python -m scripts.msf_capabilities_explorer_builder.cli --check
          python -m scripts.msf_capabilities_explorer_builder.verify_permuted_generation

      - name: Update Explorer snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_msf_capabilities_explorer_builder.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"mechanics": 325,': '"mechanics": 324,',
              '"operations": 8864,': '"operations": 9147,',
              '"preservedActions": 4971,': '"preservedActions": 4688,',
              '"phases": 2493,': '"phases": 2492,',
              '"totalPhases": 2493,': '"totalPhases": 2492,',
              '"averagePhasesPerAbility": 1.343211,': '"averagePhasesPerAbility": 1.342672,',
              '"singleActionPhaseRatio": 0.15002,': '"singleActionPhaseRatio": 0.15008,',
              '"singlePhaseAbilities": 1301,': '"singlePhaseAbilities": 1302,',
              '"multiPhaseAbilities": 541,': '"multiPhaseAbilities": 540,',
              '"assignedOperations": 8101,': '"assignedOperations": 8368,',
              '"textSegmentsAlignedHigh": 3312,': '"textSegmentsAlignedHigh": 3339,',
              '"textSegmentsAlignedMedium": 4083,': '"textSegmentsAlignedMedium": 4059,',
              '"textSegmentsTextOnly": 1823,': '"textSegmentsTextOnly": 1813,',
              '"textSegmentsAmbiguous": 382,': '"textSegmentsAmbiguous": 389,',
              '"MULTIPLE_PHASE_CANDIDATES": 382,': '"MULTIPLE_PHASE_CANDIDATES": 389,',
              '"SOURCE_TARGET_WITHOUT_TEXT": 3974,': '"SOURCE_TARGET_WITHOUT_TEXT": 3972,',
              '"UNALIGNED_PLAYER_PHASE": 744,': '"UNALIGNED_PLAYER_PHASE": 743,',
              '"UNASSIGNED_TEXT_SEGMENT": 1823,': '"UNASSIGNED_TEXT_SEGMENT": 1813,',
              '"phasesWithMechanicalTarget": 2005,': '"phasesWithMechanicalTarget": 2004,',
              '"phasesWithProbableAttachment": 902,': '"phasesWithProbableAttachment": 898,',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one snapshot match for {old!r}, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_msf_capabilities_explorer_builder.py
          git commit -m "test: update Explorer ability energy snapshot"
          git push origin HEAD:agent/codex-ability-energy-normalization

      - name: Test all capability pipeline suites
        run: |
          python -m unittest tests.test_msf_ability_energy_normalization -v
          python -m unittest discover -s tests -p 'test_msf_capabilities_normalizer.py' -v
          python -m unittest discover -s tests -p 'test_msf_capabilities_indexer.py' -v
          python -m unittest discover -s tests -p 'test_msf_capabilities_web_publisher.py' -v
          python -m unittest discover -s tests -p 'test_msf_capabilities_explorer_builder.py' -v

      - name: Verify generated ability-energy mechanic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/data/msf-capabilities-explorer')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          generation = root / manifest['currentPath']
          mechanic = json.loads((generation / 'mechanics/action-ability-energy.json').read_text(encoding='utf-8'))
          assert mechanic['label'] == 'Énergie de capacité', mechanic
          assert mechanic['globalEvidence'] == 'normalized', mechanic['globalEvidence']
          assert mechanic['counts']['byEvidence']['normalized'] > 0, mechanic['counts']
          assert mechanic['counts']['byEvidence'].get('preserved_uninterpreted', 0) == 0, mechanic['counts']

          deathlok = json.loads((generation / 'characters/Deathlok.json').read_text(encoding='utf-8'))
          basic = next(a for a in deathlok['abilities'] if a['type'] == 'basic')
          labels = [item['text'] for phase in basic['presentation']['playerPhases'] for item in phase.get('playerItems', [])]
          assert any('Génère 1 énergie de capacité' in label for label in labels), labels
          assert any('jusqu’à 2 alliés aléatoires' in label for label in labels), labels
          print('ability_energy generated mechanic:', mechanic['counts'])
          print('Deathlok labels:', labels)
          PY

      - name: Test Codex frontend
        run: node --test tests/codex-core.test.mjs tests/codex-static.test.mjs

      - name: Commit regenerated publications
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/msf-capabilities docs/data/msf-capabilities-explorer
          if git diff --cached --quiet; then
            echo 'No generated publication changes.'
          else
            git commit -m "chore: regenerate Codex for ability energy"
            git push origin HEAD:agent/codex-ability-energy-normalization
          fi
