name: Investigate MSF Web Playable client (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/investigate-msf-client.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Extract targeted IL2CPP types from public build 10.5.0
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/msf-client
          mkdir -p "$root/raw" "$root/unpacked" "$root/data-files" "$root/dump"
          base=https://webplayable.m3.scopelypv.com/10_5_0/1666317/Build
          curl --fail --location --silent --show-error "$base/b03aef900365212daf07c9180a2c210c.data.gz" -o "$root/raw/client.data.gz"
          curl --fail --location --silent --show-error "$base/0ff9aed6cda3f63a95295ed31db4348e.wasm.gz" -o "$root/raw/client.wasm.gz"
          gzip -dc "$root/raw/client.data.gz" > "$root/unpacked/client.data"
          gzip -dc "$root/raw/client.wasm.gz" > "$root/unpacked/client.wasm"

          python - <<'PY'
          from pathlib import Path
          import struct
          payload = Path("/tmp/msf-client/unpacked/client.data").read_bytes()
          signature = b"UnityWebData1.0\0"
          assert payload.startswith(signature)
          position = len(signature)
          header_length = struct.unpack_from("<I", payload, position)[0]
          position += 4
          output = Path("/tmp/msf-client/data-files")
          while position < header_length:
              offset, size, path_length = struct.unpack_from("<III", payload, position)
              position += 12
              path = payload[position:position + path_length].decode()
              position += path_length
              target = output / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload[offset:offset + size])
          PY

          curl --fail --location --silent --show-error             https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip             -o "$root/Il2CppDumper.zip"
          unzip -q "$root/Il2CppDumper.zip" -d "$root/Il2CppDumper"
          export DOTNET_ROLL_FORWARD=Major
          dotnet "$root/Il2CppDumper/Il2CppDumper.dll"             "$root/unpacked/client.wasm"             "$root/data-files/Il2CppData/Metadata/global-metadata.dat"             "$root/dump" || test -f "$root/dump/dump.cs"

          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path("/tmp/msf-client/dump")
          text = (root / "dump.cs").read_text(errors="replace")
          segments = re.split(r"(?=^// Namespace:)", text, flags=re.MULTILINE)

          def header(segment):
              lines = segment.splitlines()
              return next((line for line in lines if re.search(r"\b(class|interface|struct|enum)\b", line)), "")

          print("CORE_TYPE_SEGMENTS")
          for segment in segments:
              h = header(segment)
              selected = (
                  "ParseExternalAssetLists" in segment
                  or "RulesAssetLists" in h
                  or "RulesManager " in h
                  or "RulesPreloadManager " in h
                  or "HttpEndPoint " in h
                  or "SparxLoginDataHelper" in h
                  or "RemoteAssetClient.AssetType" in segment
                  or re.search(r"\b(stoken|sver)\b", segment, re.IGNORECASE)
              )
              if selected:
                  print("SEGMENT_HEADER", h)
                  print(segment[:50000])

          print("EXACT_IDENTIFIERS")
          lines = text.splitlines()
          patterns = {
              "uid": re.compile(r"\b(uid|Uid|UID)\b"),
              "stoken": re.compile(r"\b(stoken|sToken|SToken|sessionToken|securityToken|serverToken)\b"),
              "sver": re.compile(r"\bsver\b"),
              "asset": re.compile(r"ParseExternalAssetLists|GetCachedAssetLists|GetAssetLists|BeginCachingExternalData"),
          }
          for label, pattern in patterns.items():
              hits = [i for i,line in enumerate(lines) if pattern.search(line)]
              print("IDENTIFIER", label, "COUNT", len(hits))
              for i in hits[:100]:
                  prior = next((lines[j] for j in range(i, max(-1,i-200), -1) if re.search(r"\b(class|interface|struct|enum)\b", lines[j])), "")
                  print("HIT", i+1, prior, "::", lines[i].strip())

          literals = json.loads((root / "stringliteral.json").read_text())
          print("TOKEN_LITERAL_FORMS")
          for item in literals:
              value = str(item.get("value", ""))
              if (
                  value in {"uid", "UID", "Uid", "stoken", "sver", "ts", "|1", "%7C1"}
                  or value.endswith("|1")
                  or "%7C1" in value
                  or "asset-lists" in value
              ):
                  print(json.dumps(item, sort_keys=True))
          PY


          sudo apt-get update -qq
          sudo apt-get install -y -qq wabt
          wasm-objdump -d "$root/unpacked/client.wasm" > "$root/client.wasm.dis"
          python - <<'PY' > /tmp/msf-client/annotated-calls.txt
          from pathlib import Path
          import json, re

          root=Path("/tmp/msf-client")
          dis=(root/"client.wasm.dis").read_text(errors="replace").splitlines()
          script=json.loads((root/"dump/script.json").read_text())["ScriptMethod"]
          byaddr={int(x["Address"]): x["Name"] for x in script}
          literals=json.loads((root/"dump/stringliteral.json").read_text())
          bylit={int(x["address"],16): x["value"] for x in literals}
          import_offset=2340
          targets={
            "RulesListsCache.Fetch":0x15D98,
            "RulesListsCache.Fetch.callback0":0x15D9F,
            "RulesListsCache.Fetch.callback1":0x15DA0,
            "LoginAPI.PartAssetLists":0x95C2,
            "LoginAPI.LoginData":0x95BF,
            "HttpEndPoint.Prepare":0x37A5,
            "HttpEndPoint.Generate":0x37A7,
            "HttpEndPoint.Sign":0xA635,
            "LoginManager.LocalUserId":0x259F,
          }
          starts={}
          for i,line in enumerate(dis):
            m=re.search(r"func\[(\d+)\]",line)
            if m: starts[int(m.group(1))]=i
          sorted_starts=sorted(starts)
          for label,address in targets.items():
            fn=address-import_offset
            print("\nTARGET",label,"SCRIPT_ADDRESS",hex(address),"WASM_FUNC",fn,"METHOD",byaddr.get(address))
            if fn not in starts:
              print("NOT_FOUND"); continue
            i=starts[fn]
            candidates=[starts[x] for x in sorted_starts if x>fn]
            j=min(candidates) if candidates else len(dis)
            block=dis[i:j]
            for line in block:
              cm=re.search(r"call\s+(\d+)",line)
              km=re.search(r"i32\.const\s+(\d+)",line)
              annotations=[]
              if cm:
                callee=int(cm.group(1))+import_offset
                if callee in byaddr: annotations.append("CALL="+byaddr[callee])
              if km:
                value=int(km.group(1))
                if value in bylit: annotations.append("LITERAL="+repr(bylit[value]))
              if annotations or len(block)<500:
                print(line,(" ;; "+" | ".join(annotations)) if annotations else "")
          PY

      - name: Upload temporary analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: msf-il2cpp-analysis
          retention-days: 1
          compression-level: 9
          path: |
            /tmp/msf-client/dump/dump.cs
            /tmp/msf-client/dump/script.json
            /tmp/msf-client/dump/stringliteral.json
            /tmp/msf-client/annotated-calls.txt
