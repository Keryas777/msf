name: Build war index

on:
  push:
    paths:
      - "docs/data/war/**"
      - "scripts/build-war-index.mjs"
      - ".github/workflows/build-war-index.yml"

permissions:
  contents: write

concurrency:
  group: build-war-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build war index
        run: node scripts/build-war-index.mjs

      - name: Build war stats and history
        run: node scripts/build-war-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/war/index.json
          git add docs/data/war/index.json docs/data/war-stats.json docs/data/war-history-lite.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild war index"
            git push
          fi