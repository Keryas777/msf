name: Validate Alliance Standings History

on:
  pull_request:
    paths:
      - "docs/data/alliance-standings/**"
      - "docs/alliance-history*"
      - "docs/data/alliances.json"
      - "tests/alliance-standings-data.test.mjs"
      - "tests/alliance-history-charts.test.mjs"
      - "tests/alliance-r2-import.test.mjs"
      - "scripts/lib/alliance-r2-history.mjs"
      - "scripts/pull-alliance-history-r2.mjs"
      - ".github/workflows/pull-alliance-standings-r2.yml"
      - ".github/workflows/test-alliance-standings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate timestamped alliance snapshots and chart contract
        run: |
          node --check docs/alliance-history-data.js
          node --check docs/alliance-history.js
          node --test tests/alliance-standings-data.test.mjs tests/alliance-history-charts.test.mjs tests/alliance-r2-import.test.mjs
