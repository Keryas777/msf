name: War Analysis Provider Benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Fournisseur à exécuter
        required: true
        default: all
        type: choice
        options:
          - all
          - groq
          - cloudflare-glm
          - cloudflare-gemma

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify benchmark fixture
        run: test -f experiments/war-analysis-provider-benchmark/fixtures/athena-2026-08-04.json

      - name: Verify required secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: |
          if { [ "${{ inputs.provider }}" = "all" ] || [ "${{ inputs.provider }}" = "groq" ]; } && [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY missing"
            exit 1
          fi
          if [ "${{ inputs.provider }}" != "groq" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID missing"
            exit 1
          fi
          if [ "${{ inputs.provider }}" != "groq" ] && [ -z "$CLOUDFLARE_WORKERS_AI_TOKEN" ]; then
            echo "CLOUDFLARE_WORKERS_AI_TOKEN missing"
            exit 1
          fi

      - name: Run provider benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
        run: node experiments/war-analysis-provider-benchmark/run.mjs --provider "${{ inputs.provider }}" --execute experiments/war-analysis-provider-benchmark/fixtures/athena-2026-08-04.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: war-analysis-provider-benchmark-athena-2026-08-04
          path: experiments/war-analysis-provider-benchmark/BENCHMARK_RESULT.md
          if-no-files-found: warn
