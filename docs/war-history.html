<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />

  <style>
    html.authChecking body{
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script>
    document.documentElement.classList.add("authChecking");
  </script>

  <script src="./auth-guard.js?v=2"></script>

  <meta name="theme-color" content="#0b0c0d" />
  <title>Historique des Guerres</title>

  <link rel="stylesheet" href="./style.css?v=9" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-512.PNG" />
  <meta name="apple-mobile-web-app-title" content="LoSP" />
</head>

<body class="page-war-history">
  <div class="app">

    <header class="header" aria-label="Historique des stats de guerres">
      <button class="backBtn" aria-label="Retour" onclick="history.back()">⬅️</button>

      <div class="headerLeft">
        <h1 class="title">Historique des Guerres</h1>
        <p class="subtitle">
          Consulte les performances et résultats des guerres passées
        </p>
      </div>

      <a href="./home.html" class="homeBtn" aria-label="Accueil">🏠</a>
    </header>

    <section class="card">
      <div class="cardHeader">
        <h2 class="cardTitle">Sélection</h2>
      </div>

      <div class="warHistoryFilters warHistoryFilters--compact">
        <div class="warHistoryField">
          <label class="label" for="allianceSelect">Alliance</label>
          <select id="allianceSelect" class="select select--compact"></select>
        </div>

        <div class="warHistoryField">
          <label class="label" for="yearSelect">Année</label>
          <select id="yearSelect" class="select select--compact"></select>
        </div>

        <div class="warHistoryField">
          <label class="label" for="monthSelect">Mois</label>
          <select id="monthSelect" class="select select--compact"></select>
        </div>

        <div class="warHistoryField">
          <label class="label" for="daySelect">Jour</label>
          <select id="daySelect" class="select select--compact"></select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="warHistoryTabs" role="tablist" aria-label="Affichage historique de guerre">
        <button
          id="warHistoryTabTable"
          class="warHistoryTabBtn is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="warHistoryPanelTable"
          data-tab="table"
        >
          Tableau
        </button>

        <button
          id="warHistoryTabNotes"
          class="warHistoryTabBtn"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="warHistoryPanelNotes"
          data-tab="notes"
        >
          Notes
        </button>

        <button
          id="warHistoryTabDebrief"
          class="warHistoryTabBtn"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="warHistoryPanelDebrief"
          data-tab="debrief"
        >
          Débrief
        </button>
      </div>
    </section>

    <section
      id="warHistoryPanelTable"
      class="card warHistoryTabPanel is-active"
      role="tabpanel"
      aria-labelledby="warHistoryTabTable"
    >
      <div class="cardHeader">
        <h2 class="cardTitle">Tableau</h2>
      </div>

      <div id="warHistoryMeta" class="warHistoryMeta"></div>

      <div class="warHistoryTableWrap">
        <div class="warHistoryTable">
          <div class="warHistoryRow warHistoryHead">
            <div class="warHistoryCell col-rank is-sticky-1">#</div>

            <button class="warHistoryCell col-player is-sticky-2 warHistoryHeadBtn" data-sort="name" type="button">
              Joueur
            </button>

            <button class="warHistoryCell col-ap warHistoryHeadBtn" data-sort="attack_points" type="button">
              Pts
            </button>

            <button class="warHistoryCell col-attacks warHistoryHeadBtn" data-sort="attacks" type="button">
              Att
            </button>

            <button class="warHistoryCell col-damage warHistoryHeadBtn" data-sort="damage" type="button">
              Dégâts
            </button>

            <button class="warHistoryCell col-defensewins warHistoryHeadBtn" data-sort="defense_wins" type="button">
              V. Déf
            </button>

            <button class="warHistoryCell col-defensebonus warHistoryHeadBtn" data-sort="defense_bonus" type="button">
              B. Déf
            </button>
          </div>

          <div id="warHistoryRows"></div>
        </div>
      </div>
    </section>

    <section
      id="warHistoryPanelNotes"
      class="card warHistoryTabPanel"
      role="tabpanel"
      aria-labelledby="warHistoryTabNotes"
      hidden
    >
      <div class="cardHeader">
        <h2 class="cardTitle">Notes</h2>
      </div>

      <div id="warHistoryNotes">
        <div class="warHistoryDebriefPlaceholder">
          <p class="warHistoryDebriefTitle">Aucune note disponible</p>
          <p class="warHistoryDebriefText">
            Cette guerre ne contient pas encore de classement enrichi.
          </p>
        </div>
      </div>
    </section>

    <section
      id="warHistoryPanelDebrief"
      class="card warHistoryTabPanel"
      role="tabpanel"
      aria-labelledby="warHistoryTabDebrief"
      hidden
    >
      <div class="cardHeader">
        <h2 class="cardTitle">Débrief</h2>
      </div>

      <div id="warHistoryDebrief">
        <div class="warHistoryDebriefPlaceholder">
          <p class="warHistoryDebriefTitle">Aucun débrief disponible</p>
          <p class="warHistoryDebriefText">
            Cette guerre ne contient pas encore d’analyse enrichie.
          </p>
        </div>
      </div>
    </section>

  </div>

  <script src="./alliances.js?v=1"></script>
  <script src="./war-history.js?v=12"></script>

  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;

      let reloading = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
          if (reg && typeof reg.update === "function") reg.update();
        } catch (e) {
          console.error(e);
        }
      });
    })();
  </script>
</body>
</html>
