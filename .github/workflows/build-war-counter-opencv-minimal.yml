name: Build minimal War Counter OpenCV.js

on:
  push:
    branches:
      - agent/war-counter-r5-opencv-minimal
    paths:
      - 'scripts/opencv_js_akaze_minimal.config.py'
      - '.github/workflows/build-war-counter-opencv-minimal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout OpenCV 4.10.0
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 4.10.0
          path: _opencv
          fetch-depth: 1

      - name: Install Emscripten SDK
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git _emsdk
          ./_emsdk/emsdk install 3.1.64
          ./_emsdk/emsdk activate 3.1.64

      - name: Build minimal AKAZE OpenCV.js
        run: |
          set -euo pipefail
          source ./_emsdk/emsdk_env.sh
          python ./_opencv/platforms/js/build_js.py _opencv_build \
            --opencv_dir ./_opencv \
            --emscripten_dir "$EMSDK/upstream/emscripten" \
            --build_wasm \
            --config "$GITHUB_WORKSPACE/scripts/opencv_js_akaze_minimal.config.py" \
            --cmake_option='-DBUILD_opencv_calib3d=OFF' \
            --cmake_option='-DBUILD_opencv_dnn=OFF' \
            --cmake_option='-DBUILD_opencv_objdetect=OFF' \
            --cmake_option='-DBUILD_opencv_photo=OFF' \
            --cmake_option='-DBUILD_opencv_video=OFF' \
            --cmake_option='-DBUILD_TESTS=OFF' \
            --cmake_option='-DBUILD_PERF_TESTS=OFF' \
            --cmake_option='-DBUILD_EXAMPLES=OFF'

      - name: Verify required JS bindings
        run: |
          set -euo pipefail
          file='_opencv_build/bin/opencv.js'
          test -s "$file"
          grep -q 'AKAZE' "$file"
          grep -q 'BFMatcher' "$file"
          grep -q 'cvtColor' "$file"
          grep -q 'resize' "$file"

      - name: Persist minimal single-file runtime and wire mobile lab
        run: |
          set -euo pipefail
          target='docs/vendor/opencv-akaze/4.10.0'
          rm -rf "$target"
          mkdir -p "$target"
          cp _opencv_build/bin/opencv.js "$target/opencv.js"

          js_bytes=$(wc -c < "$target/opencv.js")
          echo "minimal single-file opencv.js bytes=$js_bytes"
          sha256sum "$target/opencv.js" > "$target/SHA256SUMS"

          python - <<'PY'
          from pathlib import Path

          worker = Path('docs/war-counter-akaze-worker.js')
          text = worker.read_text(encoding='utf-8')
          old = 'const OPENCV_URL = "vendor/opencv/4.10.0/opencv.js";'
          new = 'const OPENCV_URL = "vendor/opencv-akaze/4.10.0/opencv.js";'
          if old not in text and new not in text:
              raise SystemExit('OpenCV worker URL not found')
          worker.write_text(text.replace(old, new), encoding='utf-8')

          html = Path('docs/war-counter-lab.html')
          html_text = html.read_text(encoding='utf-8')
          for previous in (
              'war-counter-akaze-mobile-benchmark.js?v=r5-akaze-worker-1',
              'war-counter-akaze-mobile-benchmark.js?v=r5-akaze-mobile-1',
              'war-counter-akaze-mobile-benchmark.js?v=r5-akaze-minimal-1',
          ):
              html_text = html_text.replace(
                  previous,
                  'war-counter-akaze-mobile-benchmark.js?v=r5-akaze-minimal-single-1'
              )
          html.write_text(html_text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" docs/war-counter-akaze-worker.js docs/war-counter-lab.html
          if git diff --cached --quiet; then
            echo "Minimal OpenCV.js runtime unchanged"
          else
            git commit -m "chore: vendor minimal single-file AKAZE OpenCV.js runtime"
            git push
          fi
