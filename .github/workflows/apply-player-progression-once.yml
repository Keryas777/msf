name: Apply player progression hook once

on:
  push:
    branches:
      - agent/player-dd-saga-progress
    paths:
      - .github/workflows/apply-player-progression-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-dd-saga-progress
          fetch-depth: 0

      - name: Patch joueur.js
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/joueur.js')
          text = path.read_text()
          old = '''  function renderAll() {
              renderIdentity();
              renderRosterChart();
              renderTeams();
            }'''
          new = '''  function renderAll() {
              renderIdentity();
              renderRosterChart();
              window.dispatchEvent(
                new CustomEvent("losp:player-profile-render", {
                  detail: { roster: getSelectedRoster() },
                })
              );
              renderTeams();
            }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 renderAll block, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Check JavaScript
        run: node --check docs/joueur.js && node --check docs/joueur-progression.js

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-player-progression-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/joueur.js .github/workflows/apply-player-progression-once.yml
          git commit -m "Connect player progression to loaded roster"
          git push origin HEAD:agent/player-dd-saga-progress
