name: Temporary Codex ability energy normalization

on:
  push:
    branches:
      - agent/codex-ability-energy-normalization

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/codex-ability-energy-normalization
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test normalizer
        run: |
          python -m unittest tests.test_msf_ability_energy_normalization -v
          python -m unittest discover -s tests -p 'test_msf_capabilities_normalizer.py' -v

      - name: Generate parser and normalizer outputs
        run: |
          python -m scripts.msf_capabilities_parser.cli
          python -m scripts.msf_capabilities_parser.cli --check
          python -m scripts.msf_capabilities_normalizer.cli
          python -m scripts.msf_capabilities_normalizer.cli --check

      - name: Update indexer contract snapshots
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import hashlib
          import json
          import re

          capabilities_path = Path('data/msf-capabilities/normalized/capabilities.json')
          payload = capabilities_path.read_bytes()
          capabilities = json.loads(payload)
          checksum = hashlib.sha256(payload).hexdigest()
          operation_counts = Counter(op['kind'] for op in capabilities['operations'])
          audit = capabilities['audit']

          path = Path('scripts/msf_capabilities_indexer/audit.py')
          text = path.read_text(encoding='utf-8')

          if '"ability_energy_generate",' not in text:
              text = text.replace(
                  '        "effect_duration_modify",\n        "battlefield_effect_set",',
                  '        "effect_duration_modify",\n        "ability_energy_generate",\n        "battlefield_effect_set",',
                  1,
              )

          text = re.sub(
              r'SNAPSHOT_CAPABILITIES_CHECKSUM = \(\n    "[a-f0-9]{64}"\n\)',
              f'SNAPSHOT_CAPABILITIES_CHECKSUM = (\n    "{checksum}"\n)',
              text,
              count=1,
          )

          block_match = re.search(
              r'SNAPSHOT_OPERATION_KINDS = \{\n(?P<body>.*?)\n\}',
              text,
              flags=re.S,
          )
          if not block_match:
              raise SystemExit('SNAPSHOT_OPERATION_KINDS block not found')
          body = ''.join(
              f'    {kind!r}: {count},\n'.replace("'", '"')
              for kind, count in sorted(operation_counts.items())
          ).rstrip('\n')
          text = text[:block_match.start('body')] + body + text[block_match.end('body'):]
          text = re.sub(r'("operationCount": )\d+,', rf'\g<1>{len(capabilities["operations"])},', text, count=1)
          text = re.sub(
              r'("preservedUninterpretedActionCount": )\d+,',
              rf'\g<1>{int(audit["preservedUninterpretedActionCount"])},',
              text,
              count=1,
          )
          path.write_text(text, encoding='utf-8')
          print('capabilities checksum:', checksum)
          print('operation counts:', dict(sorted(operation_counts.items())))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/msf_capabilities_indexer/audit.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: index normalized ability energy operations"
            git push origin HEAD:agent/codex-ability-energy-normalization
          fi

      - name: Generate and test indexer
        run: |
          python -m scripts.msf_capabilities_indexer.cli
          python -m scripts.msf_capabilities_indexer.cli --check
          python -m unittest discover -s tests -p 'test_msf_capabilities_indexer.py' -v

      - name: Publish capabilities
        run: |
          python -m scripts.msf_capabilities_web_publisher.cli
          python -m scripts.msf_capabilities_web_publisher.cli --check

      - name: Update publisher snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          from scripts.msf_capabilities_web_publisher.audit import build_stable_manifest_bytes, validate_indexed_artifacts

          index = validate_indexed_artifacts(Path('data/msf-capabilities/indexed'), allow_readme=True)
          payload = build_stable_manifest_bytes(index)
          payload_checksum = index.payload_set_checksum
          manifest_checksum = hashlib.sha256(payload).hexdigest()

          path = Path('tests/test_msf_capabilities_web_publisher.py')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'"sha256:"\n\s+"[a-f0-9]{64}",\n\s+\)',
              f'"{payload_checksum}",\n        )',
              text,
              count=1,
          )
          text = re.sub(r'self\.assertEqual\(len\(payload\), \d+\)', f'self.assertEqual(len(payload), {len(payload)})', text, count=1)
          text = re.sub(
              r'"[a-f0-9]{32}"\n\s+"[a-f0-9]{32}",',
              f'"{manifest_checksum}",',
              text,
              count=1,
          )
          path.write_text(text, encoding='utf-8')
          print('publisher payloadSetChecksum:', payload_checksum)
          print('stable manifest sha256:', manifest_checksum)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_msf_capabilities_web_publisher.py
          if ! git diff --cached --quiet; then
            git commit -m "test: update publisher ability energy snapshot"
            git push origin HEAD:agent/codex-ability-energy-normalization
          fi

      - name: Test publisher
        run: python -m unittest discover -s tests -p 'test_msf_capabilities_web_publisher.py' -v

      - name: Regenerate Codex Explorer
        run: |
          python -m scripts.msf_capabilities_explorer_builder.cli
          python -m scripts.msf_capabilities_explorer_builder.cli --check
          python -m scripts.msf_capabilities_explorer_builder.verify_permuted_generation

      - name: Test Explorer
        run: python -m unittest discover -s tests -p 'test_msf_capabilities_explorer_builder.py' -v

      - name: Verify generated ability-energy mechanic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/data/msf-capabilities-explorer')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          generation = root / manifest['currentPath']
          mechanic = json.loads((generation / 'mechanics/action-ability-energy.json').read_text(encoding='utf-8'))
          assert mechanic['label'] == 'Énergie de capacité', mechanic
          assert mechanic['globalEvidence'] == 'normalized', mechanic['globalEvidence']
          assert mechanic['counts']['byEvidence']['normalized'] > 0, mechanic['counts']
          assert mechanic['counts']['byEvidence']['preserved_uninterpreted'] == 0, mechanic['counts']

          deathlok = json.loads((generation / 'characters/Deathlok.json').read_text(encoding='utf-8'))
          basic = next(a for a in deathlok['abilities'] if a['type'] == 'basic')
          labels = [item['text'] for phase in basic['presentation']['playerPhases'] for item in phase.get('playerItems', [])]
          assert any('Génère 1 énergie de capacité' in label for label in labels), labels
          assert any('jusqu’à 2 alliés aléatoires' in label for label in labels), labels
          print('ability_energy generated mechanic:', mechanic['counts'])
          print('Deathlok labels:', labels)
          PY

      - name: Test Codex frontend
        run: node --test tests/codex-core.test.mjs tests/codex-static.test.mjs

      - name: Commit regenerated publications
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/msf-capabilities docs/data/msf-capabilities-explorer
          if git diff --cached --quiet; then
            echo 'No generated publication changes.'
          else
            git commit -m "chore: regenerate Codex for ability energy"
            git push origin HEAD:agent/codex-ability-energy-normalization
          fi
