name: Codex effects regeneration (temporary)

on:
  push:
    branches:
      - agent/codex-effects-regeneration

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/codex-effects-regeneration
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate official effects catalog
        run: python -m unittest tests.test_msf_official_effects_catalog -v

      - name: Regenerate Codex artifacts
        run: python -m scripts.msf_capabilities_explorer_builder.cli

      - name: Refresh builder regression expectations for the intended catalog change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_msf_capabilities_explorer_builder.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"mechanics": 326,': '"mechanics": 325,',
              '"textMentions": 1088,': '"textMentions": 979,',
              '"phases": 2495,': '"phases": 2493,',
              '"totalPhases": 2495,': '"totalPhases": 2493,',
              '"averagePhasesPerAbility": 1.344289,': '"averagePhasesPerAbility": 1.343211,',
              '"singleActionPhases": 376,': '"singleActionPhases": 374,',
              '"singleActionPhaseRatio": 0.150701,': '"singleActionPhaseRatio": 0.15002,',
              '"singlePhaseAbilities": 1299,': '"singlePhaseAbilities": 1301,',
              '"multiPhaseAbilities": 543,': '"multiPhaseAbilities": 541,',
              '"textSegmentsAlignedHigh": 3167,': '"textSegmentsAlignedHigh": 3311,',
              '"textSegmentsAlignedMedium": 4164,': '"textSegmentsAlignedMedium": 4082,',
              '"textSegmentsTextOnly": 1898,': '"textSegmentsTextOnly": 1824,',
              '"textSegmentsAmbiguous": 371,': '"textSegmentsAmbiguous": 383,',
              '"IMPLICIT_PRIMARY_TARGET": 446,': '"IMPLICIT_PRIMARY_TARGET": 447,',
              '"MULTIPLE_PHASE_CANDIDATES": 371,': '"MULTIPLE_PHASE_CANDIDATES": 383,',
              '"SOURCE_TARGET_WITHOUT_TEXT": 3972,': '"SOURCE_TARGET_WITHOUT_TEXT": 3975,',
              '"UNALIGNED_PLAYER_PHASE": 748,': '"UNALIGNED_PLAYER_PHASE": 744,',
              '"UNASSIGNED_TEXT_SEGMENT": 1898,': '"UNASSIGNED_TEXT_SEGMENT": 1824,',
              '"phasesWithMechanicalTarget": 2007,': '"phasesWithMechanicalTarget": 2005,',
              '"phasesWithProbableAttachment": 922,': '"phasesWithProbableAttachment": 902,',
              'trauma = self.payload("mechanics/trauma.json")': 'trauma = self.payload("mechanics/locked-debuff.json")',
              'self.assertEqual(trauma["globalEvidence"], "official_text_only")': 'self.assertEqual(trauma["globalEvidence"], "normalized")',
              'self.assertEqual({facet["id"] for facet in trauma["facets"]}, {"mention"})': 'self.assertEqual({facet["id"] for facet in trauma["facets"]}, {"effect_apply", "effect_duration_modify", "mention"})',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Expected regression snapshot text not found: {old}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run Codex builder tests
        run: python -m unittest discover -s tests -p "test_msf_capabilities_explorer_builder.py" -v

      - name: Validate generated Codex
        run: |
          python -m scripts.msf_capabilities_explorer_builder.cli --check
          python -m scripts.msf_capabilities_explorer_builder.verify_permuted_generation
          node --test tests/codex-core.test.mjs tests/codex-static.test.mjs

      - name: Verify official names propagated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/data/msf-capabilities-explorer')
          stable = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          generation = root / stable['currentPath']
          expected = {'Indestructible','Obstruction','Aveuglement','Traumatisme','Exposé','Épuisé','Vulnérabilité iso-8'}
          found = set()
          trauma = None
          for path in (generation / 'mechanics').glob('*.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              label = payload.get('label') or payload.get('name')
              if label in expected:
                  found.add(label)
              if label == 'Traumatisme':
                  trauma = (path.name, payload.get('globalEvidence'), [f.get('id') for f in payload.get('facets', [])])
          missing = expected - found
          if missing:
              raise SystemExit(f'Official effect names missing from generated mechanics: {sorted(missing)}')
          if not trauma or trauma[0] != 'locked-debuff.json' or trauma[1] != 'normalized':
              raise SystemExit(f'Unexpected Traumatisme projection: {trauma}')
          if not {'effect_apply','effect_duration_modify','mention'}.issubset(set(trauma[2])):
              raise SystemExit(f'Incomplete Traumatisme facets: {trauma}')
          print('Official names propagated:', sorted(found))
          print('Traumatisme:', trauma)
          PY

      - name: Commit regenerated artifacts and refreshed regression snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/msf-capabilities-explorer tests/test_msf_capabilities_explorer_builder.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate Codex with official effects catalog"
          git push origin HEAD:agent/codex-effects-regeneration
