<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
  <title id="title">Codex MSF</title>
  <desc id="desc">Livre ouvert abstrait, loupe et nœuds de capacités sur fond bleu nuit.</desc>
  <defs>
    <linearGradient id="background" x1="88" y1="54" x2="682" y2="732" gradientUnits="userSpaceOnUse">
