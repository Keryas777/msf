<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />

    <style>
      html.authChecking body {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <script>
      document.documentElement.classList.add("authChecking");
    </script>

    <script src="./auth-guard.js?v=2"></script>

    <meta name="theme-color" content="#0b0c0d" />
    <title>Classement TCP — Groupement</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./rankings-shared.css?v=2" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./losp-selects.css?v=1" />
  </head>

  <body class="rankingPage">
    <main class="app rankingsApp">
      <header class="header rankingsHeader">
        <button class="backBtn" type="button" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <a href="./home.html" class="homeBtn" aria-label="Accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg></a>

        <div class="headerLeft">
          <h1 class="title">Classement TCP</h1>
          <p class="subtitle">
            Comparaison de la puissance de roster (TCP) au sein du groupement
          </p>
        </div>
      </header>

      <section class="card rankingsSummary" aria-label="Résumé du classement">
        <div>
          <span class="rankingsMeta">Joueurs classés</span>
          <strong id="playersCount">0</strong>
        </div>
        <span class="rankingsSummaryNote">Groupement LoSP</span>
      </section>

      <section class="card rankingsFiltersCard">
        <span class="rankingsFilterLabel" id="allianceFilterLabel">Alliances</span>
        <details class="rankingsFilterDetails">
          <summary class="rankingsFilterSummary" aria-labelledby="allianceFilterLabel allianceFilterSummaryText">
            <span id="allianceFilterSummaryText">Toutes les alliances</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </summary>
          <div id="allianceFilters" class="filters" role="group" aria-label="Filtres alliances"></div>
        </details>
        <p class="rankingsHint">Sélectionne une ou plusieurs alliances pour affiner le classement.</p>
      </section>

      <section id="players" class="players" aria-label="Classement des joueurs"></section>
    </main>

    <script>
      document.querySelectorAll(".backBtn").forEach((btn) => {
        btn.addEventListener("click", () => history.back());
      });
    </script>

    <script src="./alliances.js?v=4"></script>
    <script src="./tcp.js?v=21"></script>
    <script src="./losp-selects.js?v=3"></script>
  </body>
</html>
