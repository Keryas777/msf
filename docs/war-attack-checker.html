<!-- /docs/war-attack-checker.html -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />
    <style>
  html.authChecking body{
    opacity: 0;
    pointer-events: none;
  }
</style>

<script>
  document.documentElement.classList.add("authChecking");
</script>

<script src="./auth-guard.js?v=2"></script>
    <title>LoSP — Checker d'Attaque</title>
    <link rel="stylesheet" href="./style.css?v=3" />
  </head>

  <body class="page-war-attack-checker">
    <a class="homeBtn" href="./home.html" aria-label="Accueil">🏠</a>

    <div class="app">
      <header class="header">
        <div class="headerLeft">
          <a href="./war-choose.html" class="backBtn" aria-label="Retour">⬅️</a>
          <h1 class="title">Checker d'Attaque</h1>
          <p class="subtitle">
            Choisis ton alliance, ton pseudo, puis une attaque restante, et vois les équipes que tu peux attaquer, et à quelle puissance.
          </p>
        </div>

        <div class="headerRight">
          <div>
            <div class="label">Alliance</div>
            <select id="allianceSelect" class="select" aria-label="Alliance"></select>
          </div>

          <div>
            <div class="label">Joueur</div>
            <select id="playerSelect" class="select" aria-label="Joueur"></select>
          </div>

          <div>
            <div class="label">Attaque restante — Famille</div>
            <select id="atkFamilySelect" class="select" aria-label="Famille d'attaque"></select>
          </div>

          <div>
            <div class="label">Attaque restante — Variante</div>
            <select id="atkVariantSelect" class="select" aria-label="Variante d'attaque"></select>
          </div>
        </div>
      </header>

      <section class="card">
        <div class="cardHeader">
          <div>
            <h2 class="cardTitle" id="atkTitle">—</h2>
            <div
              id="atkSubtitle"
              class="subtitle"
              style="margin-top: 6px;"
              aria-label="Puissance approximative de l'équipe sélectionnée"
            >
              —
            </div>
          </div>
        </div>

        <div class="portraits" id="atkPortraits" aria-label="Personnages de l'attaque"></div>
      </section>

      <section class="card">
        <div class="cardHeader cardHeader--reco">
          <div class="chipCount chipCount--sm" id="resultsCount">0</div>

          <h2 class="cardTitle cardTitle--sm">Défenses battables</h2>

          <div class="chipCount chipCount--sm" id="playerChip">—</div>
        </div>

        <div id="results" aria-label="Liste des défenses battables"></div>
      </section>
    </div>

    <script src="./auth-session.js?v=1"></script>
    <script src="./war-attack-checker.js?v=10"></script>
  </body>
</html>
