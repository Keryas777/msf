<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Historique des Guerres</title>

  <link rel="stylesheet" href="./style.css?v=5" />
</head>

<body class="page-war-history">

<div class="app">

<header class="header">
  <a href="./home.html" class="backBtn">⬅️</a>

  <div class="headerLeft">
    <h1 class="title">Historique des Guerres</h1>
    <p class="subtitle">Consulte les performances</p>
  </div>

  <a href="./home.html" class="homeBtn">🏠</a>
</header>

<!-- FILTRES -->
<div class="card">
  <div class="cardHeader">
    <h2 class="cardTitle">Filtres</h2>
  </div>

  <select id="allianceSelect" class="select"></select>
  <select id="yearSelect" class="select"></select>
  <select id="monthSelect" class="select"></select>
  <select id="daySelect" class="select"></select>
</div>

<!-- TABLE -->
<div class="card">
  <div class="cardHeader">
    <h2 class="cardTitle">Résultats</h2>
  </div>

  <table id="warTable" style="width:100%; border-collapse: collapse;">
    <thead>
      <tr>
        <th>Nom</th>
        <th data-sort="damage">Dégâts</th>
        <th data-sort="attacks">Attaques</th>
        <th data-sort="defense_wins">Défense</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

</div>

<script src="./war-history.js"></script>
</body>
</html>
