name: Tester les secrets Discord LoSP sans déployer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-losp-auth-secrets.yml"
      - "scripts/build-losp-secret-check.mjs"
      - "workers/losp-auth/secret-check-worker.js"
permissions:
  contents: read
concurrency:
  group: losp-auth-secret-check
  cancel-in-progress: false
jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les fichiers de diagnostic
        run: |
          node --check workers/losp-auth/secret-check-worker.js
          node --check scripts/build-losp-secret-check.mjs
          node scripts/build-losp-secret-check.mjs
  test-cloudflare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check-files
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les droits Cloudflare
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN absent"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID absent"; exit 1; }
      - name: Préparer le diagnostic éphémère
        run: node scripts/build-losp-secret-check.mjs
      - name: Uploader une version-test sans modifier le trafic
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload --config "$LOSP_DIAG_DIR/wrangler.jsonc" \
            --preview-alias secret-check 2>&1 | tee "$RUNNER_TEMP/losp-upload.txt"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+-losp-auth[.][A-Za-z0-9.-]+[.]workers[.]dev' \
            "$RUNNER_TEMP/losp-upload.txt" | head -1 || true)"
          if [ -z "$url" ]; then
            echo "Version URL absente. Vérifier Cloudflare > losp-auth > Settings > Domains & Routes > Version URLs."
            exit 1
          fi
          echo "LOSP_CHECK_URL=$url" >> "$GITHUB_ENV"
      - name: Tester Discord OAuth, Bot, serveur LoSP et HMAC
        shell: bash
        run: |
          set -euo pipefail
          key="$(cat "$LOSP_DIAG_DIR/key")"
          echo "::add-mask::$key"
          sleep 3
          curl -fsS --retry 3 --retry-delay 2 --retry-all-errors --max-time 50 \
            -X POST -H "X-LoSP-Probe: $key" "$LOSP_CHECK_URL/__check" \
            > "$RUNNER_TEMP/losp-results.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const v=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/losp-results.json","utf8"));
            const checks=[
              ["DISCORD_CLIENT_SECRET",v.clientSecret],
              ["DISCORD_BOT_TOKEN",v.botToken],
              ["Accès du bot au serveur LoSP",v.guildAccess],
              ["SESSION_SIGNING_SECRET",v.sessionSigningSecret]
            ];
            for(const [name,ok] of checks)console.log((ok?"OK":"ÉCHEC")+" : "+name);
            console.log("Statuts HTTP Discord :",JSON.stringify(v.http));
            if(checks.some(([,ok])=>ok!==true))process.exit(1);
          '
          echo "Tous les secrets sont valides ; aucun changement en production."
