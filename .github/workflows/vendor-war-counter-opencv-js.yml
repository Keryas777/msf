name: Vendor War Counter OpenCV.js

on:
  push:
    branches:
      - agent/war-counter-r5-opencv-selfhost
    paths:
      - '.github/workflows/vendor-war-counter-opencv-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official OpenCV.js 4.10.0 from release docs archive
        run: |
          set -euo pipefail
          mkdir -p docs/vendor/opencv/4.10.0
          tmp_zip="$(mktemp --suffix=.zip)"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-docs.zip \
            --output "$tmp_zip"
          archive_sha=$(sha256sum "$tmp_zip" | awk '{print $1}')
          test "$archive_sha" = "0ff1b7246fec72a0f5243cbac5ae663b04c6773fbb11f6b69e86ac20239d0ade"
          opencv_entry=$(unzip -Z1 "$tmp_zip" | grep -E '(^|/)opencv\.js$' | head -n 1)
          test -n "$opencv_entry"
          unzip -p "$tmp_zip" "$opencv_entry" > docs/vendor/opencv/4.10.0/opencv.js
          rm -f "$tmp_zip"
          test -s docs/vendor/opencv/4.10.0/opencv.js
          bytes=$(wc -c < docs/vendor/opencv/4.10.0/opencv.js)
          echo "opencv.js bytes=$bytes"
          test "$bytes" -gt 1000000
          sha256sum docs/vendor/opencv/4.10.0/opencv.js | tee docs/vendor/opencv/4.10.0/opencv.js.sha256

      - name: Point mobile benchmark to same-origin OpenCV.js
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/war-counter-akaze-mobile-benchmark.js')
          text = path.read_text(encoding='utf-8')
          old = 'const OPENCV_URL = "https://docs.opencv.org/4.10.0/opencv.js";'
          new = 'const OPENCV_URL = "vendor/opencv/4.10.0/opencv.js";'
          if old not in text and new not in text:
              raise SystemExit('OPENCV_URL line not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Persist vendored OpenCV.js and loader fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vendor/opencv/4.10.0/opencv.js docs/vendor/opencv/4.10.0/opencv.js.sha256 docs/war-counter-akaze-mobile-benchmark.js
          if git diff --cached --quiet; then
            echo "Vendored OpenCV.js unchanged"
          else
            git commit -m "fix: self-host OpenCV.js for mobile lab"
            git push
          fi
