      <stop offset="0.52" stop-color="#07162e"/>
      <stop offset="1" stop-color="#090d24"/>
    </linearGradient>
    <linearGradient id="book" x1="208" y1="204" x2="554" y2="492" gradientUnits="userSpaceOnUse">
