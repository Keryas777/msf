name: Events R2 validation

on:
  pull_request:
    paths:
      - "docs/evenements.js"
      - "docs/evenements.html"
      - "tests/evenements-objectives.test.mjs"
      - "scripts/publish-events-r2.mjs"
      - "tests/publish-events-r2.test.mjs"
      - ".github/workflows/publish-events-r2.yml"
      - ".github/workflows/events-r2-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/evenements.js"
      - "docs/evenements.html"
      - "tests/evenements-objectives.test.mjs"
      - "scripts/publish-events-r2.mjs"
      - "tests/publish-events-r2.test.mjs"
      - ".github/workflows/publish-events-r2.yml"
      - ".github/workflows/events-r2-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify events UI and canonical GitHub JSON publication
        run: node --test tests/evenements-objectives.test.mjs tests/publish-events-r2.test.mjs
