name: Build ISO Reco (Keryas I roster)

on:
  workflow_dispatch:

  push:
    paths:
      - "docs/data/rosters.json"
      - "scripts/fetch-iso-reco.mjs"
      - ".github/workflows/fetch-iso-reco.yml"

permissions:
  contents: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  fetch_iso_reco:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build iso-reco JSON from roster
        run: |
          node scripts/fetch-iso-reco.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/iso-reco.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update iso-reco.json from Keryas I roster"
          git push
