name: Deploy msf-upload Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/msf-upload/**"
      - ".github/workflows/deploy-msf-upload.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.34.0"
          command: deploy
          workingDirectory: workers/msf-upload
