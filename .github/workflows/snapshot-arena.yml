name: Publish completed Cloudflare Arena campaign

on:
  workflow_dispatch:
    inputs:
      source_date:
        description: "UTC date of the complete Cloudflare Arena reward campaign"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with original first enriched Infos commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Arena archive tools
        run: |
          node --check scripts/snapshot-arena-cloudflare.mjs
          node --check scripts/archive-arena-history.mjs
          node --test tests/arena-snapshot.test.mjs tests/arena-permanent-history.test.mjs

      - name: Fetch the complete Cloudflare Arena campaign
        id: generate
        env:
          SOURCE_DATE: ${{ inputs.source_date }}
        shell: bash
        run: |
          day="$SOURCE_DATE"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          node scripts/snapshot-arena-cloudflare.mjs --date="$day"

          if compgen -G ".tmp/arena-snapshots/*.json" > /dev/null; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No fresh Infos snapshot for this date; no point fabricated."
          fi

      - name: Append permanent Arena snapshots
        if: steps.generate.outputs.generated == 'true'
        run: node scripts/archive-arena-history.mjs

      - name: Verify archive-only write scope
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v -E '^docs/data/arena-history/(index[.]json|snapshots/[0-9]{4}-[0-9]{2}-[0-9]{2}[.]json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files:"; echo "$unexpected"; exit 1
          fi

      - name: Commit permanent history
        run: |
          git add docs/data/arena-history/index.json docs/data/arena-history/snapshots/
          if git diff --cached --quiet; then
            echo "No new Arena observation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: append daily Arena history"
          git push origin HEAD:main
