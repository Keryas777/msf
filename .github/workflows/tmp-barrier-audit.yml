name: Temporary Codex barrier audit
on:
  push:
    branches: [agent/codex-barrier-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit raw barrier source actions
        run: |
          python - <<'PY'
          import json, collections
          path='data/msf-capabilities/raw/characters.json'
          data=json.load(open(path, encoding='utf-8'))
          rows=[]
          candidate_shapes=collections.Counter()
          def scalar_action_type(d):
              for k in ('action','type','action_type','actionType'):
                  v=d.get(k)
                  if isinstance(v,str) and v in ('barrier','barrier_remove'):
                      return v,k
              return None,None
          def walk(x, parents=(), pointer=''):
              if isinstance(x,dict):
                  st,field=scalar_action_type(x)
                  if st:
                      rows.append((st,x,parents,pointer,field))
                  for k,v in x.items():
                      walk(v,parents+(x,),pointer+'/'+str(k).replace('~','~0').replace('/','~1'))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,parents,pointer+'/'+str(i))
          walk(data)
          print('RAW_BARRIER_ACTIONS',len(rows))
          by_type=collections.Counter(st for st,*_ in rows)
          print('BY_TYPE',by_type)
          keys=collections.Counter(); combos=collections.Counter(); vals=collections.defaultdict(collections.Counter)
          triggers=collections.Counter(); triggerfor=collections.Counter(); actionpct=collections.Counter(); conditions=0
          modes=collections.Counter(); sides=collections.Counter(); target_presence=collections.Counter()
          examples={}
          interesting=('barrier_pct','barrier_amt','barrier_remove','amount','amnt','value','action_pct','max_barrier_pct','target','recipient','only_if','only_if_target')
          for st,x,ps,pointer,field in rows:
              combos[(st,tuple(sorted(x.keys())))]+=1
              examples.setdefault((st,tuple(sorted(x.keys()))),(pointer,x))
              for k,v in x.items():
                  keys[k]+=1
                  if k in interesting:
                      vals[k][json.dumps(v,sort_keys=True,ensure_ascii=False)]+=1
              if 'action_pct' in x:
                  v=x['action_pct']; mv=v[-1] if isinstance(v,list) and v else v
                  actionpct[json.dumps(mv,ensure_ascii=False)]+=1
              target_presence['present' if 'target' in x else 'absent']+=1
              # nearest source context carrying execution metadata
              for p in reversed(ps):
                  t=p.get('trigger') or p.get('exec')
                  if t is not None:
                      triggers[json.dumps(t,sort_keys=True,ensure_ascii=False)]+=1; break
              for p in reversed(ps):
                  tf=p.get('trigger_for') if 'trigger_for' in p else p.get('triggerFor')
                  if tf is not None:
                      triggerfor[json.dumps(tf,sort_keys=True,ensure_ascii=False)]+=1; break
              if any(('only_if' in p or 'only_if_target' in p) for p in ps+(x,)): conditions+=1
              for p in ps+(x,):
                  for k in ('mode','modes'):
                      if k in p: modes[json.dumps(p[k],sort_keys=True,ensure_ascii=False)]+=1
                  for k in ('side','combat_side','combatSide'):
                      if k in p: sides[json.dumps(p[k],sort_keys=True,ensure_ascii=False)]+=1
          print('KEYS',keys)
          print('COMBOS')
          for k,n in combos.most_common(): print(n,k)
          print('VALUES')
          for k,c in vals.items(): print(k,c)
          print('ACTION_PCT_MAX',actionpct)
          print('TRIGGERS',triggers)
          print('TRIGGER_FOR',triggerfor)
          print('WITH_CONDITIONS',conditions)
          print('MODES',modes)
          print('SIDES',sides)
          print('TARGET_PRESENCE',target_presence)
          print('EXAMPLES')
          for key,(pointer,obj) in list(examples.items())[:30]:
              print(key,pointer,json.dumps(obj,ensure_ascii=False,sort_keys=True)[:1800])
          PY