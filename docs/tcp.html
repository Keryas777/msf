<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />

    <style>
      html.authChecking body {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <script>
      document.documentElement.classList.add("authChecking");
    </script>

    <script src="./auth-guard.js?v=2"></script>

    <meta name="theme-color" content="#0b0c0d" />
    <title>Classement TCP — Groupement</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./tcp.css?v=18" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <button class="backBtn" type="button" aria-label="Retour">⬅️</button>
        <a href="./home.html" class="homeBtn" aria-label="Accueil">🏠</a>

        <div class="headerLeft">
          <h1 class="title">Classement TCP</h1>
          <p class="subtitle">
            Comparaison de la puissance de roster (TCP) au sein du groupement
          </p>
        </div>
      </header>

      <section class="card filtersCard">
        <div id="allianceFilters" class="filters" role="group" aria-label="Filtres alliances"></div>
      </section>

      <section class="card">
        <div class="cardHeader">
          <div></div>
          <div class="chipCount"><span id="playersCount">0</span></div>
        </div>

        <div id="players" class="players"></div>
      </section>
    </div>

    <script>
      document.querySelectorAll(".backBtn").forEach((btn) => {
        btn.addEventListener("click", () => history.back());
      });
    </script>

    <script src="./alliances.js?v=1"></script>
    <script src="./tcp.js?v=19"></script>
  </body>
</html>
