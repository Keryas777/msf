name: Temporary Codex barrier audit
on:
  push:
    branches: [agent/codex-barrier-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run barrier semantic audit
        run: python scripts/tmp_barrier_semantic_audit.py
