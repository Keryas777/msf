<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />

    <style>
      html.authChecking body { opacity: 0; pointer-events: none; }

      .formerPlayersOption {
        margin-top: 14px;
        display: flex;
        justify-content: center;
      }

      .formerPlayersToggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255,255,255,.48);
        font-size: 12.5px;
        font-weight: 750;
        user-select: none;
      }

      .formerPlayersToggle input {
        width: 16px;
        height: 16px;
        accent-color: #9a9a9a;
      }

      .rankRow.isFormer {
        filter: grayscale(1);
        opacity: .55;
      }
    </style>
    <script>document.documentElement.classList.add("authChecking");</script>
    <script src="./auth-guard.js?v=2"></script>

    <meta name="theme-color" content="#0b0c0d" />
    <title>Classements de Guerre — Groupement</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./war-rankings.css?v=ts" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <button class="backBtn" type="button" aria-label="Retour">⬅️</button>
        <a href="./home.html" class="homeBtn" aria-label="Accueil">🏠</a>

        <div class="headerLeft">
          <h1 class="title">Classements de Guerre</h1>
          <p class="subtitle">Classements cumulés à partir des débriefs de guerre du groupement.</p>
        </div>
      </header>

<section class="card filtersCard">
  <div class="filters" role="group" aria-label="Filtres alliances"></div>
</section>

      <section class="card controlsCard">
        <div class="rankingTabs" role="tablist" aria-label="Classements disponibles">
          <button class="rankingTab is-active" type="button" data-ranking="avg_score" aria-selected="true">📈 Note</button>
          <button class="rankingTab" type="button" data-ranking="avg_score_gap" aria-selected="false">⚖️ Écart note</button>
          <button class="rankingTab" type="button" data-ranking="avg_attacks" aria-selected="false">⚔️ Attaques</button>
          <button class="rankingTab" type="button" data-ranking="avg_misses" aria-selected="false">❌ Ratés</button>
          <button class="rankingTab" type="button" data-ranking="success_rate" aria-selected="false">🎯 Réussite</button>
          <button class="rankingTab" type="button" data-ranking="avg_impact" aria-selected="false">🔥 Impact</button>
          <button class="rankingTab" type="button" data-ranking="avg_damage" aria-selected="false">💥 Dégâts</button>
          <button class="rankingTab" type="button" data-ranking="avg_damage_share" aria-selected="false">🧨 Part dégâts</button>
          <button class="rankingTab" type="button" data-ranking="avg_defense_wins" aria-selected="false">🛡️ Défense</button>
          <button class="rankingTab" type="button" data-ranking="avg_deviations" aria-selected="false">🧲 Bonus déf.</button>
        </div>

        <div class="field field--range">
          <div class="rangeHeader">
            <span class="label">Affichage</span>
          </div>

          <div class="rangeChips" role="group" aria-label="Période affichée">
            <button
              class="rangeChip is-active"
              type="button"
              data-range="all"
              aria-pressed="true"
            >
              Toutes
            </button>

            <button
              class="rangeChip"
              type="button"
              data-range="last12"
              aria-pressed="false"
            >
              12 guerres
            </button>

            <button
              class="rangeChip"
              type="button"
              data-range="last4"
              aria-pressed="false"
            >
              4 guerres
            </button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="cardHeader">
          <div>
            <h2 class="cardTitle" id="rankingTitle">📈 Note moyenne</h2>
            <div class="rankingHint" id="rankingHint">Moyenne du score total par guerre sur la période affichée.</div>
          </div>

          <div class="chipCount">
            <span id="playersCount">0</span>
          </div>
        </div>

        <div id="players" class="players" aria-label="Classement des joueurs"></div>

        <div class="formerPlayersOption">
          <label class="formerPlayersToggle">
            <input id="showFormerPlayers" type="checkbox" />
            <span>Afficher les anciens joueurs</span>
          </label>
        </div>
      </section>
    </div>

    <script>
      (function () {
        document.querySelectorAll(".backBtn").forEach((btn) => {
          btn.addEventListener("click", () => history.back());
        });

        document.querySelectorAll('link[rel="stylesheet"]').forEach((l) => {
          if (l.href.includes("v=ts")) {
            l.href = l.href.replace("v=ts", "v=" + Date.now());
          }
        });

        const alliances = document.createElement("script");
        alliances.src = "./alliances.js?v=1";
        alliances.defer = true;
        document.body.appendChild(alliances);

        const s = document.createElement("script");
        s.src = "./war-rankings.js?v=3";
        s.defer = true;
        alliances.addEventListener("load", () => document.body.appendChild(s));
        alliances.addEventListener("error", () => document.body.appendChild(s));
      })();
    </script>
  </body>
</html>
