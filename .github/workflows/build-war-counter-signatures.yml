name: Build War Counter portrait signatures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/data/msf-characters.json
      - scripts/build-war-counter-signatures.py
      - .github/workflows/build-war-counter-signatures.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/build-war-counter-signatures.py
      - name: Commit generated signatures
        run: |
          if git diff --quiet -- docs/data/war-counter-vision/portrait-signatures.json; then
            echo "No signature change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/war-counter-vision/portrait-signatures.json
          git commit -m "chore: update war counter portrait signatures"
          git push
