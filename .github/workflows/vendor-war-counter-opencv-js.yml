name: Vendor War Counter OpenCV.js

on:
  push:
    branches:
      - agent/war-counter-r5-opencv-selfhost
    paths:
      - '.github/workflows/vendor-war-counter-opencv-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official OpenCV.js 4.10.0
        run: |
          set -euo pipefail
          mkdir -p docs/vendor/opencv/4.10.0
          curl --fail --location --retry 3 --retry-delay 2 \
            https://docs.opencv.org/4.10.0/opencv.js \
            --output docs/vendor/opencv/4.10.0/opencv.js
          test -s docs/vendor/opencv/4.10.0/opencv.js
          bytes=$(wc -c < docs/vendor/opencv/4.10.0/opencv.js)
          echo "opencv.js bytes=$bytes"
          test "$bytes" -gt 1000000
          head -c 200 docs/vendor/opencv/4.10.0/opencv.js | grep -qE 'var Module|cv|OpenCV|function' || true
          sha256sum docs/vendor/opencv/4.10.0/opencv.js | tee docs/vendor/opencv/4.10.0/opencv.js.sha256

      - name: Persist vendored OpenCV.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vendor/opencv/4.10.0/opencv.js docs/vendor/opencv/4.10.0/opencv.js.sha256
          if git diff --cached --quiet; then
            echo "Vendored OpenCV.js unchanged"
          else
            git commit -m "chore: vendor OpenCV.js 4.10 for mobile lab"
            git push
          fi
