<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />

    <style>
      html.authChecking body {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <script>
      document.documentElement.classList.add("authChecking");
    </script>

    <script src="./auth-guard.js?v=2"></script>

    <meta name="theme-color" content="#0b0c0d" />
    <title>Classement MVP — Groupement</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./mvp.css?v=16" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <button class="backBtn" type="button" aria-label="Retour">⬅️</button>
        <a href="./home.html" class="homeBtn" aria-label="Accueil">🏠</a>

        <div class="headerLeft">
          <h1 class="title">Classement MVP</h1>
          <p class="subtitle">
            Classement du nombre de MVP glanés depuis le début du jeu
            (y compris en-dehors du groupement)
          </p>
        </div>
      </header>

      <section class="card filtersCard">
        <div class="filters" role="group" aria-label="Filtres alliances">
          <label class="filterToggle">
            <input id="filterZeus" type="checkbox" checked />
            <span class="fStack">
              <span class="fEmoji">⚡</span>
              <span class="fName">Zeus</span>
            </span>
          </label>

          <label class="filterToggle">
            <input id="filterDionysos" type="checkbox" checked />
            <span class="fStack">
              <span class="fEmoji">🍇</span>
              <span class="fName">Dionysos</span>
            </span>
          </label>

          <label class="filterToggle">
            <input id="filterPoseidon" type="checkbox" checked />
            <span class="fStack">
              <span class="fEmoji">🔱</span>
              <span class="fName">Poséidon</span>
            </span>
          </label>

          <label class="filterToggle">
            <input id="filterKronos" type="checkbox" checked />
            <span class="fStack">
              <span class="fEmoji">⏳</span>
              <span class="fName">Kronos</span>
            </span>
          </label>
        </div>
      </section>

      <section class="card">
        <div class="cardHeader">
          <div></div>
          <div class="chipCount"><span id="playersCount">0</span></div>
        </div>

        <div id="players" class="players"></div>
      </section>
    </div>

    <script>
  document.querySelectorAll(".backBtn").forEach((btn) => {
    btn.addEventListener("click", () => history.back());
  });
</script>

<script src="./mvp.js?v=16"></script>
  </body>
</html>
