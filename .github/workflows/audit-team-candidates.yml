name: Audit automatic MSF team candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/generate-teams-candidates.mjs"
      - "scripts/update-msf-release-history.mjs"
      - "tests/msf-team-candidates.test.mjs"
      - ".github/workflows/audit-team-candidates.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test candidates and existing release monitor
        run: node --test tests/msf-team-candidates.test.mjs tests/msf-release-monitor.test.mjs
      - name: Generate candidates and baseline comparison without publishing
        run: node scripts/generate-teams-candidates.mjs
      - name: Upload candidates and review report
        uses: actions/upload-artifact@v4
        with:
          name: msf-team-candidates-audit
          path: |
            docs/data/teams-generated.json
            data/msf-teams/teams-audit.json
          retention-days: 14
